<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width:300px; padding:16px; font-family:system-ui,sans-serif; margin:0; background:#fff; }
  h2 { color:#1a1a2e; margin:0 0 4px; font-size:18px; }
  .sub { color:#888; font-size:12px; margin-bottom:16px; }
  .mode-switcher { display:flex; gap:8px; margin-bottom:8px; }
  .mode-btn { flex:1; padding:8px; border:2px solid #1a1a2e; border-radius:8px; background:#fff; color:#1a1a2e; font-weight:600; font-size:13px; cursor:pointer; transition:.2s; }
  .mode-btn.active { background:#1a1a2e; color:#fff; }
  .mode-desc { font-size:12px; color:#888; margin-bottom:12px; text-align:center; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .toggle { position:relative; width:44px; height:24px; flex-shrink:0; }
  .toggle input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#ccc; border-radius:24px; cursor:pointer; transition:.3s; }
  .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.3s; }
  input:checked + .slider { background:#1a1a2e; }
  input:checked + .slider:before { transform:translateX(20px); }
  .stat { background:#f5f5f5; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .section { border-top:1px solid #eee; padding-top:12px; margin-top:4px; }
  .section-title { font-size:12px; font-weight:600; color:#888; text-transform:uppercase; margin-bottom:10px; }
  .filter-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13px; }
  .filter-row label { color:#444; }
  input[type=number] { width:80px; padding:4px 8px; border:1px solid #ddd; border-radius:6px; font-size:13px; text-align:right; }
  input[type=number]:focus { outline:none; border-color:#1a1a2e; }
  .btn { display:block; background:#1a1a2e; color:#fff; text-align:center; padding:10px; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; border:none; width:100%; cursor:pointer; margin-top:12px; }
  .saved { color:#22c55e; font-size:12px; text-align:center; margin-top:6px; display:none; }
</style>
</head>
<body>
<h2>IndMart</h2>
<p class="sub">Оценка оборудования на Авито</p>
<div class="mode-switcher">
  <button class="mode-btn active" id="modeReseller">💼 Перекупщик</button>
  <button class="mode-btn" id="modeBuyer">🏭 Покупатель</button>
</div>
<div id="modeDesc" class="mode-desc">Оценка маржи и срока оборота для перепродажи</div>
<div class="row">
  <span>Расширение активно</span>
  <label class="toggle"><input type="checkbox" id="toggle" checked><span class="slider"></span></label>
</div>
<div class="stat" id="stat">Проверено сегодня: 0 / 10</div>
<div class="section">
  <div class="section-title">🎯 Мои критерии</div>
  <div class="filter-row">
    <label>Мин. маржа (₽)</label>
    <input type="number" id="minMargin" placeholder="0" min="0" step="1000">
  </div>
  <div class="filter-row">
    <label>Макс. оборот (дней)</label>
    <input type="number" id="maxTurnover" placeholder="60" min="1" max="365">
  </div>
  <div class="filter-row">
    <label>Только частные лица</label>
    <label class="toggle"><input type="checkbox" id="privateOnly"><span class="slider"></span></label>
  </div>
  <div class="filter-row">
    <label>Только срочные</label>
    <label class="toggle"><input type="checkbox" id="urgentOnly"><span class="slider"></span></label>
  </div>
  <button class="btn" id="saveFilters">Сохранить</button>
  <div class="saved" id="saved">✅ Сохранено!</div>
</div>
<a class="btn" href="https://indmart.ru" target="_blank" style="margin-top:8px">Открыть IndMart</a>
<script src="popup.js"></script>
</body>
</html>
