server {
    server_name indmart.ru www.indmart.ru;
    client_max_body_size 10M;
    root /var/www/html;
    index index.html;

    location /upgrade {
        alias /var/www/html/upgrade.html;
        default_type text/html;
    }

    location /admin {
        alias /var/www/html/admin.html;
        default_type text/html;
    }

    location /listings {
        alias /var/www/html/listings.html;
        default_type text/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        root /var/www/html;
    }
    location = /sitemap.xml {
        proxy_pass http://localhost:8000/sitemap.xml;
        proxy_set_header Host $host;
    }
    location ~ ^/listings/[0-9] {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            return 204;
        }
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/indmart.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indmart.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = indmart.ru) { return 301 https://$host$request_uri; }
    if ($host = www.indmart.ru) { return 301 https://$host$request_uri; }
    listen 80;
    server_name indmart.ru www.indmart.ru;
    client_max_body_size 10M;
    return 404;
}
